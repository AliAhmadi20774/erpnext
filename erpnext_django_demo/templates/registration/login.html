{% load static %}
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | هسته ERP</title><link rel="icon" type="image/svg+xml" href="{% static 'demo/favicon.svg' %}"><link rel="stylesheet" href="{% static 'demo/style.css' %}"></head>
<body class="auth-page"><main class="auth-card"><div class="brand auth-brand"><span class="brand-mark">◈</span><span><strong>هسته ERP</strong><small>ورود امن به محیط نمایشی</small></span></div><h1>ورود به فضای کاری</h1><p>با حساب نقش خود وارد شوید؛ منوها و عملیات بر اساس مسئولیت شما نمایش داده می‌شوند.</p>{% if form.errors %}<div class="alert error" role="alert">نام کاربری یا گذرواژه صحیح نیست.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="id_username">نام کاربری</label><input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="id_password">گذرواژه</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div><button class="button primary wide" type="submit">ورود</button></form><small class="auth-note">این محیط فقط داده‌های ساختگی دارد.</small></main></body></html>
